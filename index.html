<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>NovaCalc</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NovaCalc">
<style>
:root{--ink:#fff;--soft:rgba(255,255,255,.62);--glass:rgba(255,255,255,.13);--edge:rgba(255,255,255,.34);--acc:#7df0ff;--hot:#ff8fd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#14122b;padding:env(safe-area-inset-top,0) 14px calc(env(safe-area-inset-bottom,0) + 14px);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:
radial-gradient(circle at 15% 12%,#6b4dff 0,transparent 42%),
radial-gradient(circle at 88% 28%,#ff5fa8 0,transparent 38%),
radial-gradient(circle at 30% 92%,#00c2d1 0,transparent 45%),
radial-gradient(circle at 92% 95%,#ffb24d 0,transparent 30%),#14122b}
.wrap{max-width:430px;margin:0 auto}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--edge);border-radius:26px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 12px 32px rgba(8,4,40,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.28) 0,transparent 38%)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 10px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
.tabs{display:flex;gap:4px;padding:5px;margin-bottom:12px;border-radius:999px}
.tabs button{flex:1;border:0;background:transparent;color:var(--soft);padding:10px 0;border-radius:999px;font:600 14px inherit;font-family:inherit;position:relative;z-index:1;transition:.2s}
.tabs button.on{color:#fff;background:rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.2)}
section{display:none}section.on{display:block}
.disp{padding:16px 20px;margin-bottom:12px;text-align:right;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.hist{font-size:13px;color:var(--soft);max-height:38px;overflow:hidden}
.hist span{display:block;cursor:pointer}
.expr{font-size:22px;color:var(--soft);word-break:break-all;min-height:28px}
.res{font-size:44px;font-weight:300;line-height:1.1;word-break:break-all}
.res.err{font-size:20px;color:var(--hot)}
.fn{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.fn::-webkit-scrollbar{display:none}
.fn button{flex:0 0 auto;min-width:54px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button.k{border:1px solid var(--edge);color:#fff;font:500 22px inherit;font-family:inherit;height:62px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.07));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 14px rgba(8,4,40,.28);transition:transform .12s,background .2s}
button.k:active{transform:scale(.93);background:rgba(255,255,255,.34)}
button.k.op{color:var(--acc)}
button.k.eq{background:linear-gradient(160deg,rgba(125,240,255,.75),rgba(125,150,255,.5));color:#0b1030;font-weight:700}
button.k.sm{height:42px;font-size:16px;border-radius:16px}
button.k.wide{grid-column:span 2}
.card{padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{width:100%;font:500 18px inherit;font-family:inherit;color:#fff;background:rgba(255,255,255,.12);border:1px solid var(--edge);border-radius:16px;padding:13px 14px;outline:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
input::placeholder{color:var(--soft)}
input:focus,select:focus{border-color:var(--acc)}
select option{color:#111}
.go{width:100%;height:52px;font-size:18px}
.seg{display:flex;gap:4px;padding:5px;border-radius:999px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--soft);padding:10px 4px;border-radius:999px;font:600 14px inherit;font-family:inherit;position:relative;z-index:1;transition:.2s}
.seg button.on{color:#fff;background:rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.2)}
.seg.sm button{font-size:13px;padding:9px 2px}
#mode{display:none}#mode.show{display:flex}
.pick{position:relative;width:100%;margin-bottom:10px;z-index:5}
.pick>button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;font:500 17px inherit;font-family:inherit;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid var(--edge);border-radius:18px;padding:14px 16px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5)}
.pick .list{display:none;position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:48vh;overflow-y:auto;padding:6px;border-radius:22px;background:rgba(40,30,100,.55);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--edge);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 18px 40px rgba(0,0,0,.5)}
.pick.open .list{display:block}
.pick .list button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#fff;font:500 16px inherit;font-family:inherit;padding:12px 14px;border-radius:14px}
.pick .list button.on{background:rgba(125,240,255,.22);color:var(--acc)}
.pick .list button:active{background:rgba(255,255,255,.25)}
.logo{width:38px;height:38px;border-radius:11px;margin-right:10px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.vis{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;font-family:"Segoe Print","Chalkboard SE","Comic Sans MS",ui-rounded,system-ui,sans-serif;font-size:26px;font-weight:600}
.vis>div:first-child{flex:0 0 auto}
.lr{white-space:nowrap;line-height:1.28;height:1.28em}
.c{display:inline-block;width:.8em;text-align:center}
.c.r{color:#ff6b6b}.c.b{color:#9a9dff}.c.g{color:#5ef28f}.c.y{color:#ffe94d}
.ln{height:0;border-top:1.5px solid rgba(255,255,255,.55);margin:2px 0}
.dv{border-left:2px solid rgba(255,255,255,.75);padding-left:10px;flex:0 0 auto}
.dd{color:#9a9dff;border-bottom:2px solid rgba(255,255,255,.75);padding-bottom:2px;margin-bottom:2px}
.qq{color:#ffe94d;white-space:nowrap}
.tabs button{font-size:13px!important}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.out{padding:16px;margin-top:12px;display:none}
.out.on{display:block}
.out h3{margin:0 0 8px;font-size:30px;font-weight:300;word-break:break-all}
pre{margin:0 0 10px;font:600 20px ui-monospace,Menlo,Consolas,monospace;color:var(--acc);overflow-x:auto;line-height:1.35}
ol{margin:0;padding-left:20px;color:var(--soft);font-size:15px;line-height:1.55}
ol li{margin-bottom:4px}ol b{color:#fff}
.hint{font-size:13px;color:var(--soft);margin:-2px 2px 10px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<header><div style="display:flex;align-items:center"><img class="logo" src="icon-192.png" alt=""><h1>NovaCalc</h1></div><button class="k sm" id="deg" style="width:70px">DEG</button></header>
<div class="glass tabs" id="tabs">
<button data-t="calc" class="on">Calcular</button><button data-t="pasos">Paso a paso</button><button data-t="mas">Más</button><button data-t="precios">Precios</button>
</div>

<div class="glass seg" id="mode"><button data-m="d">Directa</button><button data-m="p" class="on">Con pasos</button></div>
<section id="calc" class="on">
<div class="glass disp"><div class="hist" id="hist"></div><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
<div class="fn" id="fn"></div>
<div class="pad" id="pad"></div>
</section>

<section id="pasos">
<div class="glass card">
<div class="row"><input id="pa" inputmode="decimal" placeholder="Número 1"><input id="pb" inputmode="decimal" placeholder="Número 2"></div>
<div class="glass seg sm" id="pop"><button data-v="+" class="on">Suma</button><button data-v="-">Resta</button><button data-v="*">Multip.</button><button data-v="/">División</button></div>
<p class="hint">Suma, resta y multiplicación con enteros. La división acepta decimales.</p>
<button class="k eq go" id="pgo">Resolver paso a paso</button>
</div>
<div class="glass out" id="pout"></div>
</section>

<section id="mas">
<div class="glass card">
<div class="pick" id="tool"><button id="toolbtn"><span id="toolname"></span><span>⌄</span></button><div class="glass list" id="toollist"></div></div>
<div class="g4"><input id="ta" inputmode="decimal" placeholder="a"><input id="tb" inputmode="decimal" placeholder="b"><input id="tc" inputmode="decimal" placeholder="c"><input id="td" inputmode="decimal" placeholder="d"></div>
<p class="hint" id="thint"></p>
<button class="k eq go" id="tgo">Calcular</button>
</div>
<div class="glass out" id="tout"></div>
</section>
<section id="precios">
<div class="glass card">
<div class="row" style="align-items:flex-start"><input id="qsym" value="$" maxlength="4" style="width:72px;text-align:center;flex:0 0 72px">
<div class="pick" id="qtool" style="margin:0;flex:1"><button id="qtoolbtn"><span id="qtoolname"></span><span>⌄</span></button><div class="glass list" id="qtoollist"></div></div></div>
<div class="g4"><input id="qa" inputmode="decimal"><input id="qb" inputmode="decimal"><input id="qc" inputmode="decimal"><input id="qd" inputmode="decimal"></div>
<p class="hint" id="qhint"></p>
<button class="k eq go" id="qgo">Calcular</button>
</div>
<div class="glass out" id="qout"></div>
</section>
</div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>{if(!isFinite(n))throw Error('Resultado no definido');return String(parseFloat(n.toPrecision(12)))};

/* ---------- Pestañas ---------- */
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
document.querySelectorAll('#tabs button,section').forEach(x=>x.classList.remove('on'));
e.target.classList.add('on');$('#'+t).classList.add('on');$('#mode').classList.toggle('show',t!='calc')};

/* ---------- Evaluador seguro ---------- */
let deg=true;
function evaluar(s){
s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/,/g,'.').replace(/\s/g,'');
const T=s.match(/\d+\.?\d*|\.\d+|[a-z]+|[-+*\/^()!%]/g)||[];
if(T.join('')!==s)throw Error('Expresión no válida');
let i=0;const peek=()=>T[i],next=()=>T[i++];
const rad=x=>deg?x*Math.PI/180:x, arc=x=>deg?x*180/Math.PI:x;
const F={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>arc(Math.asin(x)),acos:x=>arc(Math.acos(x)),atan:x=>arc(Math.atan(x)),log:Math.log10,ln:Math.log,sqrt:Math.sqrt,cbrt:Math.cbrt,abs:Math.abs};
const C={pi:Math.PI,e:Math.E};
function fact(n){if(n<0||n%1||n>170)throw Error('Factorial no válido');let r=1;for(let k=2;k<=n;k++)r*=k;return r}
function expr(){let v=term();while(peek()=='+'||peek()=='-'){v=next()=='+'?v+term():v-term()}return v}
function term(){let v=un();while(peek()=='*'||peek()=='/'||peek()=='('||(peek()&&/^[a-z]/.test(peek()))){
if(peek()=='*'){next();v*=un()}else if(peek()=='/'){next();v/=un()}else v*=un()}return v}
function un(){if(peek()=='-'){next();return -un()}if(peek()=='+'){next();return un()}return pot()}
function pot(){let b=post();if(peek()=='^'){next();return Math.pow(b,un())}return b}
function post(){let v=prim();while(peek()=='!'||peek()=='%'){v=next()=='!'?fact(v):v/100}return v}
function prim(){const t=next();
if(t===undefined)throw Error('Expresión incompleta');
if(/^[\d.]/.test(t))return parseFloat(t);
if(t=='('){const v=expr();if(next()!=')')throw Error('Falta cerrar paréntesis');return v}
if(C[t]!==undefined)return C[t];
if(F[t]){if(next()!='(')throw Error('Usa '+t+'( )');const v=expr();if(peek()==')')next();return F[t](v)}
throw Error('No entiendo "'+t+'"')}
const r=expr();if(i<T.length)throw Error('Expresión no válida');return r}

/* ---------- Teclado ---------- */
let ex='',hist=[];
const upd=()=>{$('#expr').textContent=ex;$('#hist').innerHTML=hist.slice(-2).map(h=>`<span data-v="${h[1]}">${h[0]} = ${h[1]}</span>`).join('')};
$('#hist').onclick=e=>{if(e.target.dataset.v){ex+=e.target.dataset.v;upd()}};
function vivo(){try{if(!ex){$('#res').textContent='0';return}$('#res').className='res';$('#res').textContent=fmt(evaluar(ex))}catch(e){}}
function tecla(k){
if(k=='C'){ex='';$('#res').textContent='0';$('#res').className='res'}
else if(k=='⌫')ex=ex.slice(0,-1);
else if(k=='='){try{const r=fmt(evaluar(ex));hist.push([ex,r]);ex=r;$('#res').className='res';$('#res').textContent=r}catch(e){$('#res').className='res err';$('#res').textContent=e.message}upd();return}
else ex+=k;
upd();vivo()}
const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','(',')'];
$('#pad').innerHTML=keys.map(k=>`<button class="k ${'C⌫%÷×−+'.includes(k)?'op':''}" data-k="${k}">${k}</button>`).join('')+'<button class="k eq" style="grid-column:span 4" data-k="=">=</button>';
const fns=[['sin','sin('],['cos','cos('],['tan','tan('],['√','sqrt('],['x²','^2'],['xʸ','^'],['log','log('],['ln','ln('],['π','π'],['e','e'],['n!','!'],['|x|','abs('],['∛','cbrt('],['asin','asin('],['acos','acos('],['atan','atan(']];
$('#fn').innerHTML=fns.map(f=>`<button class="k sm op" data-k="${f[1]}">${f[0]}</button>`).join('');
document.addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k)tecla(k.dataset.k)});
$('#deg').onclick=()=>{deg=!deg;$('#deg').textContent=deg?'DEG':'RAD';vivo()};

/* ---------- Paso a paso ---------- */
const ds=n=>String(n).split('').map(Number);
const pad=(s,n)=>String(s).padStart(n);
const ord=['unidades','decenas','centenas','millares','decenas de millar','centenas de millar','millones'];
const nm=i=>ord[i]||('posición '+(i+1));
const cells=W=>Array.from({length:W},()=>({c:' ',k:''}));
function put(row,end,txt,k){txt=String(txt);for(let i=0;i<txt.length;i++){const q=end-txt.length+1+i;if(q>=0&&q<row.length)row[q]={c:txt[i],k}}}
const grid=(rows,W)=>rows.map(r=>r==='-'?`<div class="ln" style="width:${W*.8}em"></div>`:'<div class="lr">'+r.map(x=>`<span class="c ${x.k}">${x.c==' '?'&nbsp;':x.c}</span>`).join('')+'</div>').join('');
const row1=(W,end,t,k,ex)=>{const r=cells(W);put(r,end,t,k);if(ex)put(r,ex[0],ex[1],ex[2]);return r};

function pasosSuma(a,b){const A=ds(a).reverse(),B=ds(b).reverse(),n=Math.max(A.length,B.length),st=[],cs=[];let c=0,out=[];
for(let i=0;i<n;i++){const x=A[i]||0,y=B[i]||0,s=x+y+c;st.push(`<b>${nm(i)}:</b> ${x} + ${y}${c?' + '+c+' (llevada)':''} = ${s} → escribo ${s%10}${s>9?' y llevo 1':''}`);out.push(s%10);cs[i]=s>9;c=s>9?1:0}
if(c){out.push(1);st.push('Queda 1 de llevada: lo escribo al inicio.')}
const r=out.slice().reverse().join(''),W=r.length+1,cr=cells(W);
cs.forEach((v,i)=>{if(v)put(cr,W-2-i,'1','g')});
return{draw:`<div class="vis"><div>${grid([cr,row1(W,W-1,a,'r'),row1(W,W-1,b,'r',[0,'+','b']),'-',row1(W,W-1,r,'y')],W)}</div></div>`,res:r,st}}

function pasosResta(a,b){if(a<b)throw Error('El primer número debe ser mayor o igual que el segundo');
const A=ds(a).reverse(),B=ds(b).reverse(),st=[],bs=[];let br=0,out=[];
for(let i=0;i<A.length;i++){let x=A[i]-br,y=B[i]||0,txt=`<b>${nm(i)}:</b> `;
if(x<y){txt+=`${x} es menor que ${y}, pido prestado: ${x+10} − ${y} = ${x+10-y}`;out.push(x+10-y);br=1;bs[i]=true}
else{txt+=`${x}${br?' (tras prestar)':''} − ${y} = ${x-y}`;out.push(x-y);br=0}st.push(txt)}
const r=String(parseInt(out.reverse().join(''))),W=String(a).length+1,cr=cells(W);
bs.forEach((v,i)=>{if(v)put(cr,W-2-i,'1','g')});
return{draw:`<div class="vis"><div>${grid([cr,row1(W,W-1,a,'r'),row1(W,W-1,b,'r',[0,'−','b']),'-',row1(W,W-1,r,'y')],W)}</div></div>`,res:r,st}}

function pasosMult(a,b){const B=ds(b).reverse(),st=[],ps=[],r=a*b;
B.forEach((d,i)=>{const p=a*d;st.push(`<b>${nm(i)}</b> (${d}): ${a} × ${d} = ${p}${i?' → lo corro '+i+' lugar'+(i>1?'es':'')+' a la izquierda':''}`);ps.push(p*Math.pow(10,i))});
const W=Math.max(String(r).length,String(a).length,String(b).length)+1;
const rows=[row1(W,W-1,a,'r'),row1(W,W-1,b,'r',[0,'×','b']),'-'];
if(B.length>1){B.forEach((d,i)=>rows.push(row1(W,W-1-i,a*d,'b')));rows.push('-');st.push(`Sumo todo: ${ps.join(' + ')} = <b>${r}</b>`)}
rows.push(row1(W,W-1,r,'y'));
return{draw:`<div class="vis"><div>${grid(rows,W)}</div></div>`,res:String(r),st}}

function pasosDiv(a,b){if(!b)throw Error('No se puede dividir entre 0');
const I=ds(a),ni=I.length,S=[];let r=0,go=false,x=0;
while(x<ni+4){if(x>=ni&&r==0)break;
const d=x<ni?I[x]:0,cur=r*10+d,t=Math.floor(cur/b),p=b*t,nr=cur-p;
if(!go&&t==0&&x<ni-1){r=nr;x++;continue}
S.push({x,cur,t,p,prev:r,nr,first:!go});go=true;r=nr;x++}
const dn=S.filter(s=>s.x>=ni).length,W=ni+(dn?1+dn:0)+1,col=i=>(i<ni?i:i+1)+1;
const top=cells(W);I.forEach((d,i)=>put(top,col(i),d,'r'));
if(dn){put(top,ni+1,',','r');for(let i=ni;i<ni+dn;i++)put(top,col(i),'0','r')}
const rows=[top],st=[];
S.forEach(s=>{const c=col(s.x);
if(!s.first){if(s.prev>0)rows.push(row1(W,c-1,s.prev,'g'));rows.push(row1(W,c,s.cur,'g'))}
rows.push(row1(W,c,s.p,'b',[c-String(s.p).length,'−','b']));rows.push('-');
st.push((s.x==ni?'Pongo la coma y bajo un 0. ':s.x>ni?'Bajo otro 0. ':s.first?'':'Bajo el siguiente dígito. ')+`${s.cur} ÷ ${b}: cabe ${s.t} (${b} × ${s.t} = ${s.p}), sobran ${s.nr}`)});
const L=S[S.length-1];rows.push(row1(W,col(L.x),L.nr,'g'));
const qi=S.filter(s=>s.x<ni).map(s=>s.t).join(''),qd=S.filter(s=>s.x>=ni).map(s=>s.t).join('');
const q=qi+(qd?','+qd:''),g=gcd(a,b);
st.push(`Fracción exacta: ${a/g}/${b/g}`+(b/g==1?'':` (≈ ${fmt(a/b)})`));
return{draw:`<div class="vis"><div>${grid(rows,W)}</div><div class="dv"><div class="dd">${b}</div><div class="qq">${q}${L.nr?'…':''}</div></div></div>`,res:(L.nr?'≈ ':'= ')+q,st}}

$('#pgo').onclick=()=>{const o=$('#pout');
try{const A=$('#pa').value.trim().replace(',','.'),B=$('#pb').value.trim().replace(',','.');
if(!/^\d+(\.\d+)?$/.test(A)||!/^\d+(\.\d+)?$/.test(B))throw Error('Escribe dos números positivos');
const dc=t=>(t.split('.')[1]||'').length,k=Math.max(dc(A),dc(B));
if(k&&popV!='/')throw Error('Esta operación usa números enteros. Solo la división admite decimales');
const f=Math.pow(10,k),a=Math.round(parseFloat(A)*f),b=Math.round(parseFloat(B)*f);
const r={'+':pasosSuma,'-':pasosResta,'*':pasosMult,'/':pasosDiv}[popV](a,b);
if(k)r.st.unshift(`Quito los decimales: multiplico los dos números por ${f} → ${a} ÷ ${b}`);
o.innerHTML=direct?`<h3>${r.res}</h3>`:`${r.draw}<h3>${r.res}</h3><ol>${r.st.map(t=>`<li>${t}</li>`).join('')}</ol>`}
catch(e){o.innerHTML=`<h3 style="font-size:18px;color:var(--hot)">${e.message}</h3>`}
o.classList.add('on')};

/* ---------- Más operaciones ---------- */
const gcd=(a,b)=>b?gcd(b,a%b):a;
const T={
mcd:{n:'MCD (máximo común divisor)',h:'a y b enteros',f:(a,b)=>{const st=[];let x=a,y=b;while(y){st.push(`${x} ÷ ${y} → resto ${x%y}`);[x,y]=[y,x%y]}return{r:'MCD = '+x,st:[...st,'El último divisor distinto de 0 es el MCD (Euclides).']}}},
mcm:{n:'MCM (mínimo común múltiplo)',h:'a y b enteros',f:(a,b)=>{const g=gcd(a,b);return{r:'MCM = '+a*b/g,st:[`MCD(${a}, ${b}) = ${g}`,`MCM = (${a} × ${b}) ÷ ${g} = ${a*b/g}`]}}},
fac:{n:'Factorización en primos',h:'a entero mayor que 1',f:a=>{if(a<2||a%1)throw Error('Usa un entero mayor que 1');const st=[],f=[];let n=a;for(let p=2;p*p<=n;p++)while(n%p==0){st.push(`${n} ÷ ${p} = ${n/p}`);f.push(p);n/=p}if(n>1){st.push(`${n} es primo`);f.push(n)}const g={};f.forEach(p=>g[p]=(g[p]||0)+1);return{r:Object.entries(g).map(([p,e])=>e>1?p+'^'+e:p).join(' × '),st}}},
pct:{n:'Porcentaje: a % de b',h:'a = porcentaje, b = cantidad',f:(a,b)=>({r:fmt(a*b/100),st:[`${a}% de ${b} = ${a} × ${b} ÷ 100`,`= ${a*b} ÷ 100`]})},
pcc:{n:'¿Qué porcentaje es a de b?',h:'a = parte, b = total',f:(a,b)=>({r:fmt(a/b*100)+'%',st:[`(${a} ÷ ${b}) × 100`]})},
pot:{n:'Potencia: a elevado a b',h:'a = base, b = exponente',f:(a,b)=>({r:fmt(Math.pow(a,b)),st:[b>0&&b%1==0&&b<=6?`${Array(b).fill(a).join(' × ')}`:`${a}^${b}`]})},
rai:{n:'Raíz b-ésima de a',h:'a = número, b = índice (vacío = 2)',f:(a,b)=>{b=b||2;return{r:fmt(Math.pow(a,1/b)),st:[`Busco x tal que x^${b} = ${a}`]}}},
fra:{n:'Simplificar fracción a/b',h:'a numerador, b denominador',f:(a,b)=>{const g=gcd(Math.abs(a),Math.abs(b));return{r:`${a/g}/${b/g}`,st:[`MCD(${a}, ${b}) = ${g}`,`Divido arriba y abajo entre ${g}`,`Decimal: ${fmt(a/b)}`]}}},
bas:{n:'Convertir decimal a binario/hex',h:'a entero positivo',f:a=>({r:'Bin: '+(a>>>0).toString(2),st:['Octal: '+a.toString(8),'Hexadecimal: '+a.toString(16).toUpperCase(),'Divide entre 2 repetidamente y lee los restos al revés.']})},
cua:{n:'Ecuación ax² + bx + c = 0',h:'Escribe a, b y c',f:(a,b,c)=>{const d=b*b-4*a*c,st=[`Discriminante = b² − 4ac = ${d}`];if(d<0)return{r:'Sin soluciones reales',st};const x1=(-b+Math.sqrt(d))/(2*a),x2=(-b-Math.sqrt(d))/(2*a);st.push(`x = (−b ± √${d}) ÷ ${2*a}`);return{r:`x₁ = ${fmt(x1)}, x₂ = ${fmt(x2)}`,st}}},
mod:{n:'Resto (módulo) a mod b',h:'a y b enteros',f:(a,b)=>({r:String(a%b),st:[`${a} ÷ ${b} = ${Math.floor(a/b)} y sobran ${a%b}`]})},
rad:{n:'Raíz con enteros (√ simplificada)',h:'Saca los enteros de la raíz. Ej: √72 = 6√2',p:['Número','Índice (vacío = 2)'],f:(a,b)=>{b=b||2;if(a<0&&b%2==0)throw Error('No hay raíz real de un negativo con índice par');const s=a<0?-1:1,n=Math.abs(a);if(n<2||n%1)return{r:fmt(s*Math.pow(n,1/b)),st:['Usa un entero mayor que 1 para simplificar']};let m=n,out=1,inn=1;const ps={},st=[];for(let p=2;p*p<=m;p++)while(m%p==0){ps[p]=(ps[p]||0)+1;m/=p}if(m>1)ps[m]=(ps[m]||0)+1;
st.push('Factorizo: '+n+' = '+Object.entries(ps).map(([p,e])=>e>1?p+'^'+e:p).join(' × '));
for(const[p,e]of Object.entries(ps)){const q=Math.floor(e/b);out*=Math.pow(+p,q);inn*=Math.pow(+p,e%b);if(q)st.push(`${p}^${e}: salen ${q} (grupos de ${b}), dentro quedan ${e%b}`)}
out*=s;const sym=b==2?'√':b==3?'∛':b+'√';
const r=inn==1?String(out):(Math.abs(out)==1?(out<0?'−':''):out)+sym+inn;
st.push('Decimal: '+fmt(s*Math.pow(n,1/b)));return{r,st}}},
imp:{n:'Fracción → número mixto (con entera)',h:'a/b. Ej: 17/5 = 3 2/5',p:['Numerador a','Denominador b'],f:(a,b)=>{if(!b)throw Error('El denominador no puede ser 0');const m=Math.abs(a),w=Math.floor(m/Math.abs(b)),r=m%Math.abs(b),sg=(a<0)!=(b<0)?'−':'';const g=gcd(r,Math.abs(b))||1;
return{r:r?`${sg}${w} ${r/g}/${Math.abs(b)/g}`:sg+w,st:[`${m} ÷ ${Math.abs(b)} = ${w} y sobran ${r}`,`La entera es ${w}; el resto ${r} va sobre ${Math.abs(b)}`+(g>1?` (simplifico entre ${g})`:'')]}}},
mix:{n:'Número mixto → fracción',h:'Entera, numerador y denominador. Ej: 3 2/5 = 17/5',p:['Entera','Numerador','Denominador'],f:(a,b,c)=>{if(!c)throw Error('El denominador no puede ser 0');const sg=a<0?-1:1,n=sg*(Math.abs(a)*c+b);return{r:`${n}/${c}`,st:[`Multiplico la entera por el denominador: ${Math.abs(a)} × ${c} = ${Math.abs(a)*c}`,`Le sumo el numerador: ${Math.abs(a)*c} + ${b} = ${Math.abs(a)*c+b}`,`Pongo el resultado sobre ${c}`,'Decimal: '+fmt(n/c)]}}},
fsu:{n:'Sumar fracciones a/b + c/d',h:'a/b + c/d',p:['a','b','c','d'],f:(a,b,c,d)=>{const m=b*d/gcd(b,d),n=a*(m/b)+c*(m/d);return{r:frs(n,m),st:[`Común denominador (MCM): ${m}`,`${a}×${m/b}/${m} + ${c}×${m/d}/${m}`,`${a*(m/b)}/${m} + ${c*(m/d)}/${m} = ${n}/${m}`]}}},
fre:{n:'Restar fracciones a/b − c/d',h:'a/b − c/d',p:['a','b','c','d'],f:(a,b,c,d)=>{const m=b*d/gcd(b,d),n=a*(m/b)-c*(m/d);return{r:frs(n,m),st:[`Común denominador (MCM): ${m}`,`${a*(m/b)}/${m} − ${c*(m/d)}/${m} = ${n}/${m}`]}}},
fmu:{n:'Multiplicar fracciones a/b × c/d',h:'a/b × c/d',p:['a','b','c','d'],f:(a,b,c,d)=>({r:frs(a*c,b*d),st:[`Arriba con arriba: ${a} × ${c} = ${a*c}`,`Abajo con abajo: ${b} × ${d} = ${b*d}`]})},
fdi:{n:'Dividir fracciones a/b ÷ c/d',h:'a/b ÷ c/d',p:['a','b','c','d'],f:(a,b,c,d)=>{if(!c)throw Error('No se puede dividir entre 0');return{r:frs(a*d,b*c),st:[`Invierto la segunda: ${c}/${d} → ${d}/${c}`,`Multiplico: ${a}×${d} / ${b}×${c} = ${a*d}/${b*c}`]}}},
d2f:{n:'Decimal → fracción',h:'a = decimal. Ej: 0,75 = 3/4',p:['Decimal'],f:a=>{let k=0;while(Math.abs(a*Math.pow(10,k)%1)>1e-9&&k<9)k++;const n=Math.round(a*Math.pow(10,k)),d=Math.pow(10,k);return{r:frs(n,d),st:[`${a} tiene ${k} decimal${k==1?'':'es'}`,`Lo escribo como ${n}/${d}`,'Simplifico dividiendo entre el MCD']}}},
r3:{n:'Regla de tres',h:'Si a vale b, entonces c vale ?',p:['a','vale b','c'],f:(a,b,c)=>({r:fmt(b*c/a),st:[`${a} → ${b}`,`${c} → x`,`x = (${b} × ${c}) ÷ ${a}`]})},
lin:{n:'Ecuación ax + b = c',h:'Resuelve x',p:['a','b','c'],f:(a,b,c)=>{if(!a)throw Error('a no puede ser 0');return{r:'x = '+fmt((c-b)/a),st:[`Paso b al otro lado: ${a}x = ${c} − ${b} = ${c-b}`,`Divido entre ${a}: x = ${c-b}/${a}`]}}},
sci:{n:'Notación científica',h:'a = número',p:['Número'],f:a=>{if(!a)throw Error('Usa un número distinto de 0');const e=Math.floor(Math.log10(Math.abs(a)));return{r:`${fmt(a/Math.pow(10,e))} × 10^${e}`,st:['Muevo la coma hasta tener un dígito entero','El exponente cuenta los lugares movidos']}}},
rom:{n:'Número romano',h:'a entre 1 y 3999',p:['Número'],f:a=>{if(a<1||a>3999||a%1)throw Error('Usa un entero de 1 a 3999');let r='',n=a;[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']].forEach(([v,s])=>{while(n>=v){r+=s;n-=v}});return{r,st:['Voy restando el valor romano más grande que cabe']}}}
};
const fs=(n,d)=>{const g=gcd(Math.abs(n),Math.abs(d))||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return[n,d]};
const frs=(n,d)=>{if(!d)throw Error('El denominador no puede ser 0');[n,d]=fs(n,d);if(d==1)return String(n);const m=Math.abs(n);return m>d?`${n}/${d} = ${n<0?'−':''}${Math.floor(m/d)} ${m%d}/${d}`:`${n}/${d}`};

let direct=false,popV='+',toolV='mcd';
$('#mode').onclick=e=>{const m=e.target.dataset.m;if(!m)return;direct=m=='d';
document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));
$('#pout').classList.remove('on');$('#tout').classList.remove('on');$('#qout').classList.remove('on')};
$('#pop').onclick=e=>{const v=e.target.dataset.v;if(!v)return;popV=v;
document.querySelectorAll('#pop button').forEach(b=>b.classList.toggle('on',b.dataset.v==v))};
$('#toollist').innerHTML=Object.entries(T).map(([k,v])=>`<button data-tk="${k}">${v.n}</button>`).join('');
const setTool=k=>{toolV=k;$('#toolname').textContent=T[k].n;
document.querySelectorAll('#toollist button').forEach(b=>b.classList.toggle('on',b.dataset.tk==k));
$('#tool').classList.remove('open');hint()};
$('#toolbtn').onclick=()=>$('#tool').classList.toggle('open');
$('#toollist').onclick=e=>{const k=e.target.dataset.tk;if(k)setTool(k);e.stopPropagation()};
document.addEventListener('click',e=>{if(!e.target.closest('#tool'))$('#tool').classList.remove('open')});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
const ids=['#ta','#tb','#tc','#td'],K1={rad:1,fac:1,bas:1,rai:1,cua:3,mcd:2};
const need=k=>K1[k]||(T[k].p?T[k].p.length:2);
const hint=()=>{const k=toolV,t=T[k],p=t.p||(k=='cua'?['a','b','c']:k=='fac'||k=='bas'?['a']:k=='rai'?['Número','Índice']:['a','b']);
$('#thint').textContent=t.h;ids.forEach((s,i)=>{const el=$(s);el.style.display=i<p.length?'':'none';el.placeholder=p[i]||'';el.value=''});$('#tout').classList.remove('on')};
$('#tgo').onclick=()=>{const o=$('#tout');
try{const v=ids.map(s=>parseFloat($(s).value.replace(',','.')));
const k=toolV,t=T[k];
for(let i=0;i<need(k);i++)if(isNaN(v[i]))throw Error('Completa todos los campos');
const r=t.f(v[0],v[1],v[2],v[3]);
if(String(r.r).includes('NaN')||String(r.r).includes('Infinity'))throw Error('Revisa los valores');
o.innerHTML=direct?`<h3>${r.r}</h3>`:`<h3>${r.r}</h3><ol>${r.st.map(s=>`<li>${s}</li>`).join('')}</ol>`}
catch(e){o.innerHTML=`<h3 style="font-size:18px;color:var(--hot)">${e.message}</h3>`}
o.classList.add('on')};
setTool('mcd');

/* ---------- Precios ---------- */
const sym=()=>$('#qsym').value||'';
const mm=n=>sym()+n.toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=n=>fmt(n)+'%';
const P={
des:{n:'Descuento',p:['Precio','Descuento %'],h:'Cuánto pagas con descuento',f:(a,b)=>{const d=a*b/100;return{r:mm(a-d),st:[`Descuento: ${mm(a)} × ${b}% = ${mm(d)}`,`Precio final: ${mm(a)} − ${mm(d)} = ${mm(a-d)}`,`Ahorras ${mm(d)}`]}}},
iva:{n:'Sumar impuesto (IVA)',p:['Precio sin impuesto','Impuesto %'],h:'Total con impuesto',f:(a,b)=>{const t=a*b/100;return{r:mm(a+t),st:[`Impuesto: ${mm(a)} × ${b}% = ${mm(t)}`,`Total: ${mm(a)} + ${mm(t)} = ${mm(a+t)}`]}}},
qiv:{n:'Quitar impuesto (IVA)',p:['Precio con impuesto','Impuesto %'],h:'Precio base sin impuesto',f:(a,b)=>{const base=a/(1+b/100);return{r:mm(base),st:[`Base = ${mm(a)} ÷ ${1+b/100}`,`Impuesto incluido: ${mm(a-base)}`]}}},
dei:{n:'Descuento + impuesto',p:['Precio','Descuento %','Impuesto %'],h:'Primero se descuenta y luego se suma el impuesto',f:(a,b,c)=>{const d=a*b/100,x=a-d,t=x*c/100;return{r:mm(x+t),st:[`Con descuento: ${mm(a)} − ${mm(d)} = ${mm(x)}`,`Impuesto: ${mm(x)} × ${c}% = ${mm(t)}`,`Total: ${mm(x+t)}`]}}},
can:{n:'Total por cantidad',p:['Precio por unidad','Cantidad','Descuento % (opcional)'],min:2,h:'Precio × cantidad',f:(a,b,c)=>{const t=a*b,d=t*(c||0)/100;return{r:mm(t-d),st:[`${mm(a)} × ${b} = ${mm(t)}`,...(c?[`Descuento ${c}%: −${mm(d)}`]:[])]}}},
uni:{n:'Precio por unidad',p:['Precio del paquete','Unidades en el paquete'],h:'Cuánto cuesta cada una',f:(a,b)=>({r:mm(a/b),st:[`${mm(a)} ÷ ${b} = ${mm(a/b)} por unidad`]})},
cmp:{n:'Comparar dos productos',p:['Precio A','Cantidad A','Precio B','Cantidad B'],h:'Cantidad en unidades, gramos o litros',f:(a,b,c,d)=>{const x=a/b,y=c/d;return{r:x==y?'Cuestan lo mismo':x<y?'Conviene A':'Conviene B',st:[`A: ${mm(a)} ÷ ${b} = ${mm(x)} por unidad`,`B: ${mm(c)} ÷ ${d} = ${mm(y)} por unidad`,`Diferencia: ${pc(Math.abs(x-y)/Math.max(x,y)*100)} más barato`]}}},
cam:{n:'Cambio (vuelto)',p:['Total a pagar','Pagó con'],h:'Cuánto devolver',f:(a,b)=>{if(b<a)throw Error('Falta dinero: faltan '+mm(a-b));return{r:mm(b-a),st:[`${mm(b)} − ${mm(a)} = ${mm(b-a)}`]}}},
pro:{n:'Dividir cuenta con propina',p:['Cuenta','Propina %','Personas (opcional)'],min:2,h:'Total y cuánto paga cada uno',f:(a,b,c)=>{c=c||1;const t=a*b/100,T=a+t;return{r:mm(T/c)+(c>1?' c/u':''),st:[`Propina: ${mm(a)} × ${b}% = ${mm(t)}`,`Total: ${mm(T)}`,...(c>1?[`${mm(T)} ÷ ${c} = ${mm(T/c)} por persona`]:[])]}}},
mar:{n:'Ganancia y margen',p:['Costo','Precio de venta'],h:'Cuánto ganas por cada venta',f:(a,b)=>{const g=b-a;return{r:mm(g),st:[`Ganancia: ${mm(b)} − ${mm(a)} = ${mm(g)}`,`Margen sobre la venta: ${pc(g/b*100)}`,`Sobre el costo (markup): ${pc(g/a*100)}`]}}},
ven:{n:'Precio de venta con ganancia',p:['Costo','Ganancia %'],h:'A cuánto vender',f:(a,b)=>({r:mm(a*(1+b/100)),st:[`${mm(a)} × ${1+b/100}`,`Ganancia: ${mm(a*b/100)}`]})},
aum:{n:'Aumento de precio',p:['Precio','Aumento %'],h:'Nuevo precio tras subir',f:(a,b)=>({r:mm(a*(1+b/100)),st:[`Aumento: ${mm(a)} × ${b}% = ${mm(a*b/100)}`]})},
var:{n:'Cambio de precio en %',p:['Precio anterior','Precio nuevo'],h:'Cuánto subió o bajó',f:(a,b)=>{const v=(b-a)/a*100;return{r:(v>0?'Subió ':v<0?'Bajó ':'Igual ')+pc(Math.abs(v)),st:[`(${mm(b)} − ${mm(a)}) ÷ ${mm(a)} × 100`]}}}
};
let priceV='des';const qids=['#qa','#qb','#qc','#qd'];
$('#qtoollist').innerHTML=Object.entries(P).map(([k,v])=>`<button data-qk="${k}">${v.n}</button>`).join('');
function setPrice(k){priceV=k;const t=P[k];$('#qtoolname').textContent=t.n;
document.querySelectorAll('#qtoollist button').forEach(b=>b.classList.toggle('on',b.dataset.qk==k));
$('#qtool').classList.remove('open');$('#qhint').textContent=t.h;
qids.forEach((q,i)=>{const el=$(q);el.style.display=i<t.p.length?'':'none';el.placeholder=t.p[i]||'';el.value=''});$('#qout').classList.remove('on')}
$('#qtoolbtn').onclick=()=>$('#qtool').classList.toggle('open');
$('#qtoollist').onclick=e=>{const k=e.target.dataset.qk;if(k)setPrice(k);e.stopPropagation()};
document.addEventListener('click',e=>{if(!e.target.closest('#qtool'))$('#qtool').classList.remove('open')});
$('#qgo').onclick=()=>{const o=$('#qout');
try{const t=P[priceV],v=qids.map(q=>parseFloat($(q).value.replace(',','.')));
for(let i=0;i<(t.min||t.p.length);i++)if(isNaN(v[i]))throw Error('Completa todos los campos');
const r=t.f(v[0],v[1],v[2],v[3]);
if(/NaN|Infinity/.test(r.r))throw Error('Revisa los valores');
o.innerHTML=direct?`<h3>${r.r}</h3>`:`<h3>${r.r}</h3><ol>${r.st.map(x=>`<li>${x}</li>`).join('')}</ol>`}
catch(e){o.innerHTML=`<h3 style="font-size:18px;color:var(--hot)">${e.message}</h3>`}
o.classList.add('on')};
setPrice('des');
</script>
